services:
  - type: web
    name: odinbook-frankfurt
    runtime: ruby
    plan: free
    buildCommand: './bin/render-build.sh'
    startCommand: './bin/rails server'
    region: frankfurt      
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: odinbook-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 1
      - key: RAILS_MAX_THREADS
        value: 3  
      # - key: LD_PRELOAD
      #   value: libjemalloc.so.2
      # - key: MALLOC_CONF
      #   value: "dirty_decay_ms:1000,narenas:2,background_thread:true"
      - key: MALLOC_ARENA_MAX
        value: 2
databases:
  - name: odinbook-db
    plan: free
    region: frankfurt      